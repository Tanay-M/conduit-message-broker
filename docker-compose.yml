services:
  db:
    build: ./db
    container_name: conduit-db
    environment:
      POSTGRES_USER: conduit
      POSTGRES_PASSWORD: conduit_dev
      POSTGRES_DB: conduit
      CONDUIT_SEED: ${CONDUIT_SEED:-false}
    ports:
      - "5433:5432"
    volumes:
      - conduit_pgdata:/var/lib/postgresql/data
      - ./db/sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U conduit -d conduit"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: conduit-api
    environment:
      CONDUIT_APP_DSN: postgresql://conduit_app:conduit_app_dev@db:5432/conduit
      CONDUIT_ADMIN_DSN: postgresql://conduit:conduit_dev@db:5432/conduit
      CONDUIT_ADMIN_TOKEN: ${CONDUIT_ADMIN_TOKEN:-conduit-admin-token}
    ports:
      - "8000:8000"
    volumes:
      - ./tests:/app/tests:ro
      - ./demos:/app/demos:ro
      - ./benchmarks:/app/benchmarks
    depends_on:
      db:
        condition: service_healthy

volumes:
  conduit_pgdata:

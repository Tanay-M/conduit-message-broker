services:
  db:
    build: ./db
    container_name: conduit-db
    environment:
      POSTGRES_USER: conduit
      POSTGRES_PASSWORD: conduit_dev
      POSTGRES_DB: conduit
      CONDUIT_SEED: ${CONDUIT_SEED:-false}
    ports:
      - "5433:5432"
    volumes:
      - conduit_pgdata:/var/lib/postgresql/data
      - ./db/sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U conduit -d conduit"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  conduit_pgdata:
